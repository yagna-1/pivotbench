title: "PivotBench: Which Boundary Checks Stop Cross-Protocol Prompt Injection Between MCP and A2A Without Blocking Legitimate Work"
author:
  - "Yagna Siva Sai Kumar Kolla\\thanks{Independent researcher. Contact: \\texttt{yagnasivasaikumar@gmail.com}. Code and data: \\url{https://github.com/yagna-1/pivotbench}.}"
date: "November 2026"
abstract: |
  Agent deployments combine the Model Context Protocol (MCP) for tool access with the Agent-to-Agent (A2A) protocol for delegation. In protocol pivoting, untrusted content entering through one protocol is acted on with privileges only the other can reach. We ask which boundary checks keep injected actions out without blocking legitimate work. PivotBench provides 438 attack scenarios in four classes, 48 attacks aimed at single assumptions of an authorization gate, 144 benign controls and 48 cases whose legitimate selectors exist only in tool output, plus model-generated traffic from eight models in six families: 4,845 benign delegations and 398 compromised payloads. Heuristic provenance detection fails: text-level gates that hold simulated attack success below 5% block 66–76% of real benign delegations. LLM judges asked about data provenance block 10–74% of benign messages, while judges asked about instruction provenance or authorization make almost no errors, saturating the benchmark. A structural gate that authorizes parsed actions against a plan derived only from the user's request, with typed argument endorsement, blocks 0–0.9% of benign messages and allows only out-of-scope attacks. Its sharpest limit is rule-based requests ("refund every order whose shipment was lost"): request-only endorsement blocks all 192 such legitimate actions, and endorsing values seen in tool output admits every injected selector. Endorsing a value only when an operator's system of record confirms the user's predicate blocks none of the 192 and admits no structured injection. Under a production prompt no model carried an injected action; under a policy telling models to trust tool output, every non-Claude family complied far more often than Claude, in batches and in single-case sessions.
