name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[analysis,dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m pytest -q
      - name: Smoke run (no API key)
        run: |
          pivotbench run --suite full --model sim --behavior paraphrase --gate capability+args
          python examples/run_demo.py
      - name: Reproduce dynamic-selector table
        run: python experiments/dynamic_selectors.py analyze
